name: Generate Activity Graph

on:
  schedule:
    - cron: "0 */3 * * *"  # every 3 hours
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Ashutosh00710/github-readme-activity-graph@v1
        with:
          github_username: Soggal1ng
          theme: react-dark
          output: activity-graph.svg
      - uses: actions/upload-artifact@v4
        with:
          name: activity-graph
          path: activity-graph.svg
